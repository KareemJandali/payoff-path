<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Payoff Path">
<meta name="theme-color" content="#0E2A21">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Payoff Path</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-title" content="Payoff Path">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Layout: phone = stacked cards over a bottom tab bar; desktop = left rail + two-column board.
   The journey reads left to right: Debt (coral) -> Savings (teal) -> Investing (violet). */
:root{
  --bg:#ECF0ED; --surface:#FFFFFF; --surface-2:#F4F7F5; --ink:#0F1C17; --ink-2:#55665E; --ink-3:#83938B; --line:#D8E0DB;
  --hero:#0E2A21; --hero-2:#173A2E; --hero-ink:#EDF6F1; --hero-mute:#A3C2B5; --hero-line:#2A4B3F;
  --accent:#F2B33D; --accent-ink:#2B1D00; --accent-soft:#FBEBC6;
  --debt:#D9553E; --debt-soft:#F8DED8; --save:#0E937E; --save-soft:#D3EFE9; --invest:#6656CF; --invest-soft:#E4E0FA;
  --good:#12875A; --warn:#B87400; --warn-soft:#FBEED3; --bad:#C93A2B; --bad-soft:#F9DEDB;
  --scrim:rgba(8,18,14,.5); --shadow:0 1px 2px rgba(15,28,23,.05),0 8px 24px rgba(15,28,23,.06);
  --k-blue:#2F6FD6; --k-pink:#C2408F; --k-slate:#5B6B80;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A120F; --surface:#111C18; --surface-2:#16231E; --ink:#E6EFEA; --ink-2:#9DAFA6; --ink-3:#71847B; --line:#22332C;
  --hero:#123329; --hero-2:#1A4235; --hero-ink:#EDF6F1; --hero-mute:#9EC1B3; --hero-line:#2C5446;
  --accent:#F5BE55; --accent-ink:#2B1D00; --accent-soft:#3A2F14;
  --debt:#EE7560; --debt-soft:#3A1E19; --save:#2DBFA6; --save-soft:#10302A; --invest:#9184F0; --invest-soft:#231F42;
  --good:#3CC48A; --warn:#E5A43A; --warn-soft:#382A10; --bad:#F06B5B; --bad-soft:#3A1A17;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --k-blue:#6FA0F0; --k-pink:#E278B8; --k-slate:#94A3B8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A120F; --surface:#111C18; --surface-2:#16231E; --ink:#E6EFEA; --ink-2:#9DAFA6; --ink-3:#71847B; --line:#22332C;
  --hero:#123329; --hero-2:#1A4235; --hero-ink:#EDF6F1; --hero-mute:#9EC1B3; --hero-line:#2C5446;
  --accent:#F5BE55; --accent-ink:#2B1D00; --accent-soft:#3A2F14;
  --debt:#EE7560; --debt-soft:#3A1E19; --save:#2DBFA6; --save-soft:#10302A; --invest:#9184F0; --invest-soft:#231F42;
  --good:#3CC48A; --warn:#E5A43A; --warn-soft:#382A10; --bad:#F06B5B; --bad-soft:#3A1A17;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --k-blue:#6FA0F0; --k-pink:#E278B8; --k-slate:#94A3B8; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,label,.chip span,.tab{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* shell */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.rail{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;gap:4px;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.brand{display:none}
.tab{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:7px 4px;border-radius:12px;color:var(--ink-3);font-size:11.5px;font-weight:600}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{stroke:var(--ink)}
.tab[aria-current="page"] .tab-dot{opacity:1}
.tab-dot{width:4px;height:4px;border-radius:2px;background:var(--accent);opacity:0}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 168px;min-width:0}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:16px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 2px}
.topbar h1{font-size:26px;font-weight:700}
.topbar .date{color:var(--ink-2);font-size:13.5px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.sync[data-s="saving"] i{background:var(--warn)}
.sync[data-s="error"] i{background:var(--bad)}
.sync[data-s="local"] i{background:var(--ink-3)}
@media (min-width:900px){
  .app{grid-template-columns:228px minmax(0,1fr)}
  .rail{position:sticky;top:0;bottom:auto;height:100vh;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);
    background:var(--surface);backdrop-filter:none;padding:22px 14px}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;font-family:var(--display);font-weight:700;font-size:19px}
  .brand svg{width:30px;height:30px}
  .tab{flex:0 0 auto;max-width:none;flex-direction:row;gap:12px;padding:10px 12px;font-size:14.5px;justify-content:flex-start}
  .tab[aria-current="page"]{background:var(--surface-2)}
  .tab-dot{display:none}
  main{padding-block:26px 48px}
}

/* generic pieces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.card-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-bottom:12px}
.card-h h2{font-size:18px;font-weight:700;flex:0 1 auto}
.card-h .sub{color:var(--ink-2);font-size:13px}
.cols{display:grid;gap:16px;align-items:start}
@media (min-width:1040px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1.08fr)}}
.stack{display:grid;gap:16px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn:active{transform:scale(.98)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.debt{background:var(--debt-soft);color:var(--debt)}
.pill.save{background:var(--save-soft);color:var(--save)}
.pill.invest{background:var(--invest-soft);color:var(--invest)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--save-soft);color:var(--good)}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--debt)}
.empty{color:var(--ink-2);font-size:14px;padding:6px 0}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px;position:relative;overflow:hidden;min-width:0}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid var(--hero-line);box-shadow:0 0 0 28px color-mix(in srgb,var(--hero-line) 35%,transparent),0 0 0 58px color-mix(in srgb,var(--hero-line) 18%,transparent);pointer-events:none}
.hero .eyebrow{color:var(--hero-mute)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
.hero .big{font-family:var(--display);font-weight:700;font-size:clamp(40px,11vw,54px);line-height:1.02;letter-spacing:-.025em;margin-top:8px;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.hero .asof{color:var(--hero-mute);font-size:13px;margin-top:4px;position:relative;z-index:1}
.hero .hbtn{background:var(--hero-2);color:var(--hero-ink);border:1px solid var(--hero-line);border-radius:10px;padding:6px 11px;font-size:13px;font-weight:600}
.move{margin-top:18px;background:var(--hero-2);border:1px solid var(--hero-line);border-radius:16px;padding:14px;display:grid;gap:10px;position:relative;z-index:1}
.move .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.move .what{font-size:16.5px;font-weight:600;line-height:1.35}
.move .what b{font-family:var(--display);font-size:19px}
.move .why{color:var(--hero-mute);font-size:13px}
.move .acts{display:flex;gap:8px;flex-wrap:wrap}

/* journey */
.journey{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;position:relative}
.stop{position:relative;padding-top:30px;padding-right:8px;min-width:0}
.stop::before{content:"";position:absolute;top:10px;left:0;right:0;height:3px;background:var(--line)}
.stop:first-child::before{left:9px}
.stop:last-child::before{right:auto;width:9px}
.stop .fill{position:absolute;top:10px;left:0;height:3px;background:var(--c)}
.stop:first-child .fill{left:9px}
.stop .dot{position:absolute;top:2px;left:0;width:19px;height:19px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.stop.on .dot,.stop.done .dot{border-color:var(--c)}
.stop.done .dot{background:var(--c)}
.stop.on .dot{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 22%,transparent)}
.stop .nm{font-weight:700;font-size:14px}
.stop .st{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.stop .amt{font-family:var(--mono);font-size:12.5px;margin-top:6px;color:var(--ink)}
.stop.debtc{--c:var(--debt)} .stop.savec{--c:var(--save)} .stop.investc{--c:var(--invest)}

/* alerts */
.alert{border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;border:1px solid transparent}
.alert.bad{background:var(--bad-soft);color:var(--ink);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.alert.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.alert .ic{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--display);color:var(--surface)}
.alert.bad .ic{background:var(--bad)} .alert.warn .ic{background:var(--warn)}
.alert b{font-weight:700}
.alert p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}

/* timeline */
.day{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0;padding-top:2px}
.dlab{text-align:left}
.dlab .dw{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.dlab .dn{font-family:var(--display);font-size:24px;font-weight:700;line-height:1}
.dlab .dm{font-size:12px;color:var(--ink-2)}
.dlab.today .dn{color:var(--accent)}
.items{display:grid;gap:6px;min-width:0}
.it{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:10px;align-items:center;min-height:34px}
.it .k{width:10px;height:10px;border-radius:3px;background:var(--ink-3)}
.it.income .k{background:var(--good);border-radius:50%}
.it.bill .k{background:var(--ink-3)}
.it.sched .k,.it.min .k,.it.extra .k{background:var(--debt)}
.it.save .k{background:var(--save)} .it.invest .k{background:var(--invest)}
.it.maybe .k{background:none;border:2px dashed var(--good);border-radius:50%}
.it.maybe .am{color:var(--ink-3)}
.it.reminder .k{background:var(--accent);transform:rotate(45deg);border-radius:2px}
.it.reminder .nm{font-weight:600}
.it .nm{font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.it .nm small{display:block;color:var(--ink-3);font-size:12px}
.it .am{font-family:var(--mono);font-size:14px;text-align:right;white-space:nowrap}
.it.income .am{color:var(--good)}
.it.plan{background:var(--accent-soft);border-radius:10px;padding:4px 6px 4px 8px;margin:0 -6px 0 -8px;grid-template-columns:10px minmax(0,1fr) auto auto}
.chk{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-3)}
.chk svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.eod{display:flex;justify-content:flex-end;gap:6px;font-size:12px;color:var(--ink-3);margin-top:2px}
.eod .mono{color:var(--ink-2)}
.eod.neg .mono{color:var(--bad);font-weight:600}
.eod.low .mono{color:var(--warn);font-weight:600}

/* plan */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.kpi.lead{background:var(--hero);border-color:var(--hero);color:var(--hero-ink)}
.kpi.lead .eyebrow,.kpi.lead .s{color:var(--hero-mute)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:9px;padding:7px 12px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.cmp{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cmp.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cmp .t{font-weight:700;font-size:14px}
.cmp .d{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.cmp .r{font-family:var(--mono);font-size:13px;margin-top:8px}
.order{display:grid;gap:0;counter-reset:o}
.ord{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.ord:first-child{border-top:0}
.ord .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--debt-soft);color:var(--debt)}
.ord.paid .n{background:var(--save-soft);color:var(--good)}
.ord .nm{font-weight:600}
.ord .meta{font-size:12.5px;color:var(--ink-2)}
.ord .when{text-align:right;font-size:13px}
.ord .when b{display:block;font-family:var(--display);font-size:15px}
.mv{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{margin-top:10px;width:100%}
.chart svg{display:block;width:100%;height:auto}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:620px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:9px 6px;border-bottom:1px solid var(--line);font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-family:var(--body);font-weight:600}
td.pos{color:var(--good)} td.dbt{color:var(--debt)} td.sv{color:var(--save)} td.iv{color:var(--invest)}
.how{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:h}
.how li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-size:14px;color:var(--ink-2)}
.how li::before{counter-increment:h;content:counter(h);width:24px;height:24px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink)}
.how b{color:var(--ink)}

/* debts */
.dgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.debt{display:grid;gap:12px}
.debt .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.debt .nm{font-family:var(--display);font-size:18px;font-weight:700}
.debt .left{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.debt .of{font-size:13px;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;font-size:13px}
.facts dt{color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.facts dd{margin:0;font-family:var(--mono);font-size:13px}
.debt .acts{display:flex;gap:8px;flex-wrap:wrap}
.debt.paidoff{border-color:color-mix(in srgb,var(--save) 45%,var(--line))}
.debt.paidoff .bar>i{background:var(--save)}
.total{display:grid;gap:10px}
.total .big{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hist{display:grid}

  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:14px;animation:up .22s ease-out}

/* hover only where there is a real pointer, so taps on iPhone don't leave "stuck" highlights */
@media (hover:hover){

}

.verdict.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)} .verdict.bad b{color:var(--bad)}

.goalopts li{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px}
.solist{display:grid}
.so{padding:10px 0;border-top:1px solid var(--line);display:grid;gap:6px}
.so:first-child{border-top:0;padding-top:0}
.so>b{font-size:15px}
.so small{font-size:12.5px;color:var(--ink-2)}
.sobar{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px;color:var(--ink-2)}
.sobar i{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.sobar em{display:block;height:100%;border-radius:99px;background:var(--good)}
.sobar strong{font-family:var(--mono);text-align:right;color:var(--ink)}
.coach-text{font-size:15px;line-height:1.55;white-space:pre-wrap}
/* habits */
.habs{display:grid}
.hab{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hab:first-child{border-top:0;padding-top:2px}
.ring{--p:0;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--good) calc(var(--p)*360deg),var(--surface-2) 0);position:relative}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}
.ring span{position:relative;font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.ring.done::before{background:var(--save-soft)}
.hn b{display:block;font-size:15px}
.hn small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.hbtns{display:flex;gap:6px}
.hb{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:18px;font-weight:700;color:var(--ink-3);display:grid;place-items:center}
.hb.ok[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.hb.no[aria-pressed="true"]{background:var(--debt);border-color:var(--debt);color:var(--surface)}
.hb:active{transform:scale(.94)}
.hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.hstats>div{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.hstats b{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.hstats span{font-size:11.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calnav b{font-family:var(--display);font-size:16px}
.calnav .btn{font-size:20px;min-width:40px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal i{font-style:normal;text-align:center;font-size:11px;font-weight:600;color:var(--ink-3);padding-bottom:2px}
.cd{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;padding:0}
.cd.ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.cd.no{background:var(--debt-soft);border-color:var(--debt);color:var(--debt)}
.cd.today{box-shadow:0 0 0 2px var(--accent)}

.wnow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.big2{font-family:var(--display);font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}

.moodq>span,.moodset>span{font-size:14px;color:var(--ink-2)}

.fcrow{padding:10px 0;border-top:1px solid var(--line);display:grid;gap:8px}
.fcrow:first-child{border-top:0;padding-top:0}
.fcrow>b{font-size:15px}
.fcrow small{font-size:12.5px;color:var(--ink-2)}
.fc7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.fc7>div{background:var(--surface-2);border-radius:10px;padding:7px 2px;text-align:center;display:grid;gap:2px;min-width:0}

.hrs i.on{background:var(--debt)}
.hrs-x{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3)}

.play{display:grid;gap:6px;padding:6px 0}

.live{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.live-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.live-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline}

.live-r small{grid-column:1/-1;font-size:12.5px;color:var(--ink-2)}

.exp-tonight{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:grid;gap:2px}

.exp-tonight small{font-size:12.5px;color:var(--ink-2)}

@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--ink-2)}

<script>
"use strict";
/* ---------- helpers ---------- */
const $=(s,el=document)=>el.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const r2=n=>Math.round((+n||0)*100)/100;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const CUR=new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'});
const CUR0=new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0});
const $m=n=>CUR.format(r2(n)+0);
const $m0=n=>CUR0.format(Math.round(+n||0)+0);
const D={
  parse(s){const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)},
  str(t){return new Date(t).toISOString().slice(0,10)},
  add(s,n){return D.str(D.parse(s)+n*864e5)},
  diff(a,b){return Math.round((D.parse(b)-D.parse(a))/864e5)},
  today(){const n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())},
  addMonths(s,n,day){let[y,m,d]=s.split('-').map(Number);day=day||d;m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;
    const last=new Date(Date.UTC(y,m,0)).getUTCDate();return y+'-'+pad(m)+'-'+pad(Math.min(day,last))}
};
const fmtDay=new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'});
const fmtMD=new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
const fmtMDY=new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});
const fmtMY=new Intl.DateTimeFormat('en-US',{month:'short',year:'numeric',timeZone:'UTC'});
const fmtMonL=new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric',timeZone:'UTC'});
const fmtMon=new Intl.DateTimeFormat('en-US',{month:'short',timeZone:'UTC'});
const fmtWd=new Intl.DateTimeFormat('en-US',{weekday:'short',timeZone:'UTC'});
const lbl=(f,s)=>s?f.format(D.parse(s)):'—';
const ord=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');
const num=v=>{const x=parseFloat(String(v??'').replace(/[\s$,]/g,''));return isFinite(x)?x:0};
const parseLines=t=>String(t||'').split(/\n+/).map(l=>{const m=l.trim().match(/^(\d{4}-\d{2}-\d{2})(?:\s+(.+))?$/);return m?{date:m[1],amount:r2(num(m[2]))}:null}).filter(Boolean).sort((a,b)=>a.date<b.date?-1:1);
const parseMoves=t=>{const o={};for(const l of String(t||'').split(/\n+/)){const m=l.trim().match(/^(\d{4}-\d{2}-\d{2})\D+(\d{4}-\d{2}-\d{2})$/);if(m&&m[1]!==m[2])o[m[1]]=m[2]}return o};

/* ---------- schedule engine ---------- */
function occurrences(f,from,to){
  const mv=(f&&f.moved)||{};const hasMv=Object.keys(mv).length>0;
  const raw=naturalOcc(f,hasMv?D.add(from,-70):from,hasMv?D.add(to,70):to);
  const out=[];
  for(const o of raw){const d=mv[o.date]||o.date;if(d>=from&&d<=to)out.push({date:d,amount:o.amount,nat:o.date})}
  if(hasMv)out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  return out;
}
function naturalOcc(f,from,to){
  const out=[];if(!f||f.paused)return out;
  const r=f.rule||{};const ov=f.overrides||{};
  const amt=dt=>ov[dt]!=null?+ov[dt]:+f.amount||0;
  if(r.freq==='monthly'){
    const base=from.slice(0,8)+'01';
    for(let k=0;k<600;k++){const dt=D.addMonths(base,k,+r.day||1);if(dt>to)break;if(dt>=from)out.push({date:dt,amount:amt(dt)})}
  }else if(r.freq==='biweekly'||r.freq==='weekly'){
    const step=r.freq==='weekly'?7:14;if(!r.anchor)return out;
    let n=Math.ceil(D.diff(r.anchor,from)/step);if(n<0&&!f.envelope)n=0;
    for(let dt=D.add(r.anchor,n*step);dt<=to;dt=D.add(dt,step))if(dt>=from)out.push({date:dt,amount:amt(dt)});
  }else if(r.freq==='dates'){
    for(const x of r.dates||[])if(x.date>=from&&x.date<=to)out.push({date:x.date,amount:+x.amount||0});
  }else if(r.freq==='once'){
    if(r.date&&r.date>=from&&r.date<=to)out.push({date:r.date,amount:amt(r.date)});
  }
  return out;
}
/* ---------- expenses ---------- */
var EXP=[]; // every logged expense, sorted by date: {id,ts,date,amount,cat,note,via:'bank'|<card debt id>}
const CATS=[
  {id:'groceries',name:'Groceries',ess:1,col:'--good',kw:['metro','iga','maxi','provigo','super c','costco','walmart','adonis','loblaws','marche','epicerie','dollarama','avril','lidl','food basics','sami fruits','pa nature']},
  {id:'eating',name:'Eating out',col:'--debt',kw:['mcdo','mcdonald','mcdonalds','uber eats','ubereats','doordash','skip','skipthedishes','a&w','subway','pizza','sushi','restaurant','resto','burger','poutine','shawarma','chipotle','kfc','dominos','harvey','st-hubert','lunch','dinner','souper','diner','ramen','pho','thai','banh mi','mary brown','popeyes','five guys','osmow']},
  {id:'coffee',name:'Coffee & snacks',col:'--accent',kw:['tim hortons','tim','hortons','timmies','starbucks','second cup','cafe','coffee','dunkin','depanneur','dep','snack','vending','bubble tea','boba','chatime','juice']},
  {id:'transport',name:'Transport',ess:1,col:'--invest',kw:['opus','stm','bixi','uber','lyft','taxi','exo','via rail','essence','gas','petro','petro-canada','shell','esso','ultramar','chrono','chrono-recharge','communauto','parking']},
  {id:'shopping',name:'Shopping',col:'--k-blue',kw:['amazon','winners','h&m','zara','uniqlo','best buy','apple store','simons','ikea','canadian tire','sport chek','decathlon','aliexpress','temu','shein','clothes','shoes','structube']},
  {id:'fun',name:'Fun & subscriptions',col:'--k-pink',kw:['netflix','spotify','disney','steam','playstation','xbox','nintendo','cinema','cineplex','concert','bar','club','fly.io','youtube','apple music','crave','prime video','chatgpt','openai','claude','icloud','google one','ticketmaster','bowling']},
  {id:'health',name:'Health & care',ess:1,col:'--save',kw:['pharmaprix','jean coutu','uniprix','familiprix','pharmacie','pharmacy','dentist','dentiste','clinic','clinique','shoppers','haircut','coiffure','barber','barbier','gym']},
  {id:'school',name:'School',ess:1,col:'--k-slate',kw:['ets','coop ets','textbook','book','livre','udemy','printing','impression','calculator']},
  {id:'other',name:'Other',col:'--ink-3',kw:[]}
];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const plain=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const normNote=s=>plain(s).replace(/[#*]?\d[\d.,-]*/g,' ').replace(/[^a-z&.' -]+/g,' ').replace(/\s+/g,' ').trim().split(' ').slice(0,3).join(' ');
const KW=[];for(const c of CATS)for(const k of c.kw)KW.push([k,c.id,new RegExp('(^|[^a-z])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z])')]);KW.sort((a,b)=>b[0].length-a[0].length);
/* Category guess: 1) what you picked last time for the same place, 2) keyword match (longest wins). */
function guessExpense(note){

function monthlyAvg(f){

function chartSVG(M,w){
  const h=Math.round(Math.min(260,Math.max(190,w*0.42))),pl=52,pr=14,pt=16,pb=28;
  const pts=M.daily.filter((d,i)=>i===0||d.date.endsWith('-01')).slice(0,19);
  if(pts.length<2)return '';
  const maxV=Math.max(100,...pts.map(p=>Math.max(p.debt,p.savings,p.invest)));
  const pow=Math.pow(10,Math.floor(Math.log10(maxV)));let step=pow;for(const m of[1,2,2.5,5,10]){if(maxV/(pow*m)<=4){step=pow*m;break}}
  const top=Math.ceil(maxV/step)*step;
  const X=i=>pl+(w-pl-pr)*i/(pts.length-1),Y=v=>pt+(h-pt-pb)*(1-v/top);
  let g='';
  for(let v=0;v<=top+0.1;v+=step){g+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="var(--mono)">${v>=1000?'$'+(v/1000)+'k':'$'+v}</text>`}
  const every=Math.ceil(pts.length/Math.max(2,Math.floor((w-pl-pr)/62)));
  pts.forEach((p,i)=>{if(i%every===0||i===pts.length-1&&i%every>every/2){const d=D.parse(p.date);const t=i===0?'Now':fmtMon.format(d)+(new Date(d).getUTCMonth()===0?" '"+String(new Date(d).getUTCFullYear()).slice(2):'');g+=`<text x="${X(i)}" y="${h-8}" text-anchor="${i===0?'start':'middle'}" font-size="11" fill="var(--ink-3)">${t}</text>`}});
  const line=k=>pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[k]).toFixed(1)).join(' ');
  const area=k=>line(k)+` L${X(pts.length-1).toFixed(1)} ${Y(0)} L${X(0)} ${Y(0)} Z`;
  const series=[['debt','var(--debt)'],['savings','var(--save)'],['invest','var(--invest)']];
  let s='';
  for(const[k,c]of series){if(!pts.some(p=>p[k]>0.5))continue;s+=`<path d="${area(k)}" fill="${c}" fill-opacity="0.13"/><path d="${line(k)}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li=pts.length-1;s+=`<circle cx="${X(li)}" cy="${Y(pts[li][k])}" r="4" fill="${c}" stroke="var(--surface)" stroke-width="2"/>`}
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Debt, savings and investing over the next 18 months">${g}${s}</svg>`;
}

function affordCheck(S,amt,date,via){
  const t=D.today(),buf=+S.settings.buffer||0,base=getSim().main;
  if(date<t)date=t;
  const card=via&&via!=='bank'?S.debts.find(d=>d.id===via):null;
  const run=d=>{const T=JSON.parse(JSON.stringify(S));
    if(card){const c=T.debts.find(x=>x.id===card.id);c.balance=r2((+c.balance||0)+amt)}
    else T.flows.push({id:'__afford',name:'Purchase',type:'bill',amount:amt,rule:{freq:'once',date:d}});

  const res={amt,date,via,level,low:after.lo,lowDate:after.ld,base,M,notes:[]};
  if(card){
    const bal=currentBalance(card,S.log);
    if(card.limit&&bal+amt>card.limit+0.5){res.level='no';res.declined=true}
    else if(bal>0&&level==='yes')res.level='tight';

  const before=date>t?lowFrom(base,t,D.diff(t,date)-1):{lo:Infinity};
  if(before.lo<0)res.notes.push(`Heads up: your plan is already ${$m0(-before.lo)} short around ${lbl(fmtDay,before.ld)}, before this purchase.`);
  if(res.level!=='yes'&&!res.declined){
    const cands=[...new Set(base.events.filter(e=>e.t==='income'&&e.date>date).map(e=>e.date))].slice(0,10);
    for(const c of cands){const Mc=run(c);if(lowFrom(Mc,c,90).lo>=buf&&!(card&&currentBalance(card,S.log)>0)){res.safeDate=c;break}}
  }
  const hr=hourlyRate(S);if(hr)res.hours=amt/hr;
  const wb=weeklyBudget(S);if(wb)res.weeks=amt/wb;
  return res;
}

  if(M.debtFree&&M.debtFree<=g){out.onTrack=D.diff(M.debtFree,g);return out}
  const wb=weeklyBudget(S);
  if(wb){let lo=10,hi=wb;const c={};const m0=simWithWeekly(S,lo,c);yield;
    if(ok(m0)){for(let i=0;i<7;i++){const mid=(lo+hi)/2,m=simWithWeekly(S,mid,c);yield;if(ok(m))lo=mid;else hi=mid}out.cap=Math.max(10,Math.floor(lo/5)*5);out.wb=wb}else out.capNo=true}
  const rate=hourlyRate(S),pay=S.flows.find(f=>+f.hours>0&&f.rule&&f.rule.anchor);
  if(rate&&pay){const withH=h=>{const T=JSON.parse(JSON.stringify(S));T.flows.push({id:'__h',name:'Extra hours',type:'income',amount:r2(h*rate),rule:{freq:pay.rule.freq,anchor:pay.rule.anchor}});return simulate(T)};
    let lo=0,hi=40;const mh=withH(hi);yield;if(ok(mh)){for(let i=0;i<7;i++){const mid=(lo+hi)/2,m=withH(mid);yield;if(ok(m))hi=mid;else lo=mid}out.hours=Math.max(1,Math.ceil(hi));out.rate=rate}else out.hoursNo=true}
  const withL=L=>{const T=JSON.parse(JSON.stringify(S));T.cash.amount=r2((+T.cash.amount||0)+L);return simulate(T)};
  let lo=0,hi=Math.max(500,totals().left*1.2);const ml=withL(hi);yield;
  if(ok(ml)){for(let i=0;i<9;i++){const mid=(lo+hi)/2,m=withL(mid);yield;if(ok(m))hi=mid;else lo=mid}out.lump=Math.ceil(hi/10)*10}
  return out;
}

      habits:H.map(h=>{const dw=dangerWindow(h),r=combinedRisk(h,t),f=forecast7(h)||[],pl=plansFor(h)[0];

/* ---------- actions ---------- */
function addLog(e){
  e.id=uid();e.ts=Date.now();e.date=e.date||D.today();
  state.log.push(e);
  if(e.cashDelta)state.cash.amount=r2(state.cash.amount+e.cashDelta);
  if(e.savingsDelta)state.savings.amount=r2(state.savings.amount+e.savingsDelta);
  if(e.investDelta)state.invest.amount=r2(state.invest.amount+e.investDelta);
  return e.id;
}
function undoLog(id){
  const i=state.log.findIndex(e=>e.id===id);if(i<0)return;
  const e=state.log[i];
  if(e.cashDelta)state.cash.amount=r2(state.cash.amount-e.cashDelta);
  if(e.savingsDelta)state.savings.amount=r2(state.savings.amount-e.savingsDelta);
  if(e.investDelta)state.invest.amount=r2(state.invest.amount-e.investDelta);
  if(e.type==='cash'&&'prevTs' in e)state.cash.ts=e.prevTs;
  state.log.splice(i,1);
}
const undoer=ids=>()=>{ids.forEach(undoLog);commit('Undone')};
const debtById=id=>state.debts.find(d=>d.id===id);
function doneSheet(i){
  const M=getSim().main,e=M.events[i];if(!e)return;
  if(e.t==='reminder'){
    openSheet({title:e.label,lead:(e.overdue?'Was due '+lbl(fmtMD,e.orig):lbl(fmtDay,e.date))+'. Mark it done once you have taken care of it.',body:'',submit:'Done',noFocus:true,
      onSubmit:()=>{const id=addLog({type:'flow',key:e.key,amount:0,cashDelta:0,label:e.label});commit('Done: '+e.label,undoer([id]))}});
    return;
  }
  if(e.t==='maybe'){
    openSheet({title:e.label,lead:'Not counted in your plan until it arrives. Enter what you actually received.',
      body:`<label class="fld"><span>Amount received</span><input id="d-amt" name="amount" type="number" step="0.01" min="0" inputmode="decimal" value="${(+e.amount).toFixed(2)}"></label>
        <label class="check"><input id="d-bank" name="bank" type="checkbox" checked><span>Update my bank balance too</span></label>`,
      submit:'Received',
      extra:[{label:"Didn't get it",onClick:()=>{const id=addLog({type:'flow',key:e.key,amount:0,cashDelta:0,skipped:true,label:e.label+' (not received)'});commit('Marked as not received',undoer([id]))}}],
      onSubmit:fd=>{const a=r2(num(fd.get('amount')));if(!(a>0)){toast('Enter an amount above $0');return false}
        const id=addLog({type:'flow',key:e.key,amount:a,cashDelta:fd.get('bank')==='on'?a:0,label:e.label});commit();setTimeout(()=>afterMoney(a),0)}});
    return;
  }
  const amt=Math.abs(e.amount);
  const isFlow=e.t==='income'||e.t==='bill';
  const debt=e.di!=null?state.debts[e.di]:null;
  const verb=e.t==='income'?'Received':e.t==='bill'?'Paid':e.t==='save'?'Moved to savings':e.t==='invest'?'Moved to investing':'Paid';
  openSheet({title:(e.t==='extra'?'Extra payment → ':'')+e.label,
    lead:`${KIND_LBL[e.t]} · ${e.overdue?'was due '+lbl(fmtMD,e.orig):lbl(fmtDay,e.date)}. Change the amount if it was different.`,
    body:`<label class="fld"><span>Amount ${e.t==='income'?'received':'paid'}</span><input id="d-amt" name="amount" type="number" step="0.01" min="0" inputmode="decimal" value="${amt.toFixed(2)}"></label>
      <label class="check"><input id="d-bank" name="bank" type="checkbox" checked><span>Update my bank balance too</span></label>`,
    submit:verb,
    extra:isFlow?[{label:"Didn't happen",onClick:()=>{const id=addLog({type:'flow',key:e.key,amount:0,cashDelta:0,skipped:true,label:e.label+' (skipped)'});commit('Marked as skipped',undoer([id]))}}]:[],
    onSubmit:fd=>{
      const a=r2(num(fd.get('amount')));if(!(a>0)){toast('Enter an amount above $0');return false}
      const bank=fd.get('bank')==='on';let id;
      if(isFlow)id=addLog({type:'flow',key:e.key,amount:a,cashDelta:bank?(e.t==='income'?a:-a):0,label:e.label});
      else if(e.t==='save')id=addLog({type:'save',amount:a,cashDelta:bank?-a:0,savingsDelta:a,label:'Moved to savings'});
      else if(e.t==='invest')id=addLog({type:'invest',amount:a,cashDelta:bank?-a:0,investDelta:a,label:'Moved to investing'});
      else id=addLog({type:'pay',key:e.t==='extra'?null:e.key,debtId:debt.id,amount:a,cashDelta:bank?-a:0,label:(e.t==='extra'?'Extra payment · ':e.t==='min'?'Minimum · ':'')+debt.name});
      commit(verb+' '+$m(a),undoer([id]));
    }});
}
function cashSheet(){
  const M=getSim().main;const pend=M.events.filter(e=>e.overdue&&(e.t==='income'||e.t==='bill'||e.t==='sched'||e.t==='min'));
  openSheet({title:'Bank balance',lead:'Check your bank app and type what is in your chequing account right now.',
    body:`<label class="fld"><span>Balance right now</span><input id="c-amt" name="amount" type="number" step="0.01" inputmode="decimal" value="${state.cash.set?cashNow(state).toFixed(2):''}" placeholder="0.00"></label>
      ${pend.length?`<label class="check"><input id="c-inc" name="inc" type="checkbox" checked><span>This already includes the ${pend.length} item${pend.length>1?'s':''} waiting for a check-in (${esc(pend.slice(0,3).map(e=>e.label).join(', '))}${pend.length>3?'…':''})</span></label>`:''}`,
    submit:'Save balance',
    onSubmit:fd=>{
      const a=r2(num(fd.get('amount')));const prev=state.cash.amount;const ids=[];
      if(pend.length&&fd.get('inc')==='on'){
        for(const e of pend){
          if(e.t==='income'||e.t==='bill')ids.push(addLog({type:'flow',key:e.key,amount:Math.abs(e.amount),cashDelta:0,label:e.label,note:'already in balance'}));
          else ids.push(addLog({type:'pay',key:e.key,debtId:state.debts[e.di].id,amount:Math.abs(e.amount),cashDelta:0,label:e.label,note:'already in balance'}));
        }
      }
      ids.push(addLog({type:'cash',amount:a,cashDelta:r2(a-state.cash.amount),prevTs:state.cash.ts||0,label:'Bank balance updated'}));
      state.cash.set=true;state.cash.asOf=D.today();state.cash.ts=Date.now();
      commit('Balance saved',undoer(ids));
    }});
}

  if(act==='afford')return affordSheet();
  if(act==='calendar')return calendarSheet();
  if(act==='calendar-daily')return calendarSheet('daily');
  if(act==='import')return startImport();
  if(act==='flow-edit')return flowSheet(state.flows.find(f=>f.id===id),false);
  if(act==='flow-new')return flowSheet({type:a.dataset.type},true);
  if(act==='debt-edit')return debtSheet(debtById(id),false);
  if(act==='debt-new')return debtSheet(null,true);
  if(act==='undo'){const e2=state.log.find(x=>x.id===id);undoLog(id);if(e2&&e2.type==='cash'&&!state.log.some(x=>x.type==='cash'))state.cash.set=false;commit('Undone');return}
  if(act==='strategy'){state.settings.strategy=a.dataset.v;if(a.dataset.v==='custom'&&!(state.settings.order||[]).length)state.settings.order=state.debts.map(d=>d.id);commit();return}
  if(act==='move'){const o=(state.settings.order||[]).filter(x=>state.debts.some(d=>d.id===x));for(const d of state.debts)if(!o.includes(d.id))o.push(d.id);const i=o.indexOf(id),j=i+(+a.dataset.dir);if(i<0||j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];state.settings.order=o;commit();return}
  if(act==='backup')return backupCopy();
  if(act==='backup-dl')return backupDownload();
  if(act==='sync')return IS_ARTIFACT?undefined:syncSheet();
  if(act==='restore')return restoreSheet();
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-set]');if(!el||!state)return;
  if(el.type==='checkbox'){state.settings[el.dataset.set]=el.checked;commit('Saved');return}
  const v=r2(num(el.value)),k=el.dataset.set;
  if(k==='savings')state.savings.amount=v;else if(k==='invest')state.invest.amount=v;else state.settings[k]=v;
  commit('Saved');
});
let rz=null;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(tab==='plan'){drawChart();drawOutlook();drawFan()}if(tab==='habits')drawWeight()},150)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state){simCache=null;render()}});
{const h=(location.hash||'').slice(1);if(TITLES[h])tab=h}
render();
initStore();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
